# include themes/themes/rose-pine.conf
include current-theme.conf
# enable_kitty_graphics yes        # not a kitty option; images always work
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10
modify_font      cell_height 110%  # a little line spacing; easier to read at size 9
background_opacity 0.85

shell bash
shell_integration disabled
cursor_shape block
window_padding_width 20
cursor_blink_interval 0
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0
confirm_os_window_close 0
sync_to_monitor no

cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
# cursor_trail_color #ff007f
cursor_trail_color #ebbcba         # rose trail to match the theme

url_style        curly
tab_bar_style    powerline
tab_powerline_style slanted
enable_audio_bell no
